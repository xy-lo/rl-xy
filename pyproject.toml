[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-xy"
version = "0.10.0"
description = "AstraSim-backed, auditable wafer-scale synchronous GRPO MVP"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "RL Infra project"}]
dependencies = ["protobuf==5.29.1"]

[project.optional-dependencies]
public-trace = ["tokenizers==0.22.2", "jinja2==3.1.6"]
figures = ["matplotlib>=3.8,<4", "numpy>=1.24,<3"]

[project.scripts]
rlxy = "rl_xy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

