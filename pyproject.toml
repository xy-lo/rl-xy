[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-xy"
version = "0.9.5"
description = "AstraSim-backed, auditable wafer-scale synchronous GRPO MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RL Infra project"}]
dependencies = ["protobuf==5.29.0"]

[project.scripts]
rlxy = "rl_xy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

